<!doctype html><html lang="de"><meta charset="utf-8"><meta name="application-name" content="Anlagenbuch Übersicht · Busch Group"><title>Anlagenbuch Übersicht · Busch Group</title><link rel="icon" type="image/x-icon" href="favicon.ico"><link rel="shortcut icon" href="favicon.ico"><style>
*{box-sizing:border-box}html,body{margin:0;background:#0d252b;color:white;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{padding:12px;min-width:360px}.card{background:#12343a;border-radius:22px;padding:13px 16px 11px;box-shadow:0 10px 28px #0005}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.top img{width:92px;height:auto;display:block}.brand{font-size:13px;font-weight:800;letter-spacing:.5px}.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:10px}.cell b{font-size:28px;line-height:1;display:block;font-weight:750}.cell small{display:block;color:#f0f4f3;margin-top:7px;font-size:12px;white-space:nowrap}.open b{color:#ff8177}.progress b{color:#ffd77b}.today b{color:#8fb8ff}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}.meta{color:#b9c9c6;font-size:12px}.refresh{border:0;background:transparent;color:white;font:700 12px system-ui;cursor:pointer;padding:4px 0 4px 8px}.refresh:hover{text-decoration:underline}.refresh:disabled{opacity:.55;cursor:default}</style>
<div class="card"><div class="top"><img src="busch-logo.png" alt="Busch"><div class="brand">ANLAGENBUCH</div></div>
<div class="counts"><div class="cell open"><b id="open">–</b><small>Offene Störungen</small></div><div class="cell progress"><b id="progress">–</b><small>In Bearbeitung</small></div><div class="cell today"><b id="today">–</b><small>Tagesgeschäft</small></div></div>
<div class="bottom"><div class="meta" id="updated">Aktualisiert: –</div><button class="refresh" id="refresh">Aktualisieren ›</button></div></div>
<script>
const prefix=location.pathname.split('/').slice(0,-1).join('/');
async function rpc(method,...args){const r=await fetch(prefix+'/api',{method:'POST',headers:{'Content-Type':'application/json','X-Anlagenbuch':prefix.slice(1)},body:JSON.stringify({method,args})});if(!r.ok)throw Error('Abgleich fehlgeschlagen');return (await r.json()).value;}
async function update(){try{const v=await rpc('widgetState')||{},data=v.faults||[];document.getElementById('open').textContent=data.filter(f=>f.status==='open').length;document.getElementById('progress').textContent=data.filter(f=>f.status==='in_progress').length;document.getElementById('today').textContent=v.todayCount||0;document.getElementById('updated').textContent='Aktualisiert: '+new Date(v.updatedAt||Date.now()).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});}catch{document.getElementById('updated').textContent='Aktualisiert: Verbindung prüfen';}}
document.getElementById('refresh').onclick=async()=>{const refresh=document.getElementById('refresh');refresh.disabled=true;refresh.textContent='Aktualisiere …';try{await Promise.allSettled([rpc('syncFaults'),rpc('syncWork'),rpc('retryCloud')]);await new Promise(r=>setTimeout(r,600));await update();}finally{refresh.textContent='Aktualisieren ›';refresh.disabled=false;}};
update();setInterval(update,2000);
</script></html>
